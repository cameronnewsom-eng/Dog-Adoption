<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>Employee Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='employee_portal.css') }}">
</head>
{% for dog in dogs_list %}
<tr>
    <td>
        <img src="{{ url_for('static', filename='images/' + dog.image) }}"
             style="border:2px solid black; border-radius:16px; object-fit:cover;
             width:100px; height:100px; object-fit: cover;" >
    </td>

    <td>{{ dog.name }}</td>
    <td>{{ dog.age }}</td>
    <td>{{ dog.breed }}</td>
    <td>{{ dog.sex }}</td>
    <td>{{ dog.adoption_status }}</td>

     <td style="text-align:center">

    {% if remove_mode == "true" %}

        <form method="POST" action="/employee/delete/{{ dog.ID }}">
            <button                        
                type="submit"
                style="
                padding:0;
                border:none;
                background:none;
                "
                onclick="return confirm('Are you sure you want to delete {{ dog.name }}?');">
                <img
                    src="{{ url_for('static', filename='images/delete_image.png') }}"
                    alt="Delete Profile"
                    width="40"
                    style="
                    border:2px solid black;
                    border-radius:36px;
                    cursor:pointer;">
            </button>
        </form>

    {% else %}

        <a href="/employee/{{ dog.ID }}">
            <img
                src="{{ url_for('static', filename='images/edit_image.png') }}"
                alt="Edit Profile"
                width="40"
                style="
                border:2px solid black;
                border-radius:36px;">
        </a>

    {% endif %}

    </td>
</tr>
{% endfor %}
